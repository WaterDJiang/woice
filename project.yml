name: Woice

options:
  bundleIdPrefix: com.woice
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release-Direct: release
  Release-AppStore: release

packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO

targets:
  WoiceCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/WoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woice.core
        GENERATE_INFOPLIST_FILE: YES

  Woice:
    type: application
    platform: macOS
    sources:
      - path: Sources/WoiceApp
      - path: assets/brand/exports/AppIcon.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/DistributionManifest.json
        buildPhase: resources
      - path: Resources/SBOM.json
        buildPhase: resources
      - path: Resources/NOTICES.md
        buildPhase: resources
    dependencies:
      - target: WoiceCore
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woice.app
        PRODUCT_NAME: Woice
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/Woice-Store.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WOICE_APP_STORE
        Release-Direct:
          CODE_SIGN_ENTITLEMENTS: Resources/Woice.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        Release-AppStore:
          CODE_SIGN_ENTITLEMENTS: Resources/Woice-Store.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WOICE_APP_STORE

schemes:
  Woice-Store:
    build:
      targets:
        Woice: all
    run:
      config: Debug
    archive:
      config: Release-AppStore
